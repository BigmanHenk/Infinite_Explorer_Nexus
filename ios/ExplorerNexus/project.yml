# XcodeGen spec - the .xcodeproj is generated on the build Mac (GitHub Actions), so nothing
# here needs a Mac to edit.   xcodegen generate  ->  ExplorerNexus.xcodeproj
name: ExplorerNexus
options:
  bundleIdPrefix: com.infiniteaperture
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone
    SUPPORTS_MACCATALYST: NO
    ENABLE_BITCODE: NO

targets:
  ExplorerNexus:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # explorer.sqlite (places, events, walks, tides, photo spots) + map.sqlite (offline
      # map tiles), both built on the PC by tools/build.
      - path: Content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infiniteaperture.explorernexus
        PRODUCT_NAME: Explorer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Explorer
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Explorer shows where you are on the offline map and follows you along a walk. Your location stays on your phone."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
    info:
      path: Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: en
        # explorernexus://plan?z=... links (QR code from the PC planner, shared links)
        CFBundleURLTypes:
          - CFBundleURLName: com.infiniteaperture.explorernexus.plan
            CFBundleURLSchemes: [explorernexus]
        # .explorerplan files (AirDrop, Mail, Files) open in the app
        CFBundleDocumentTypes:
          - CFBundleTypeName: Explorer plan
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.infiniteaperture.explorerplan]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.infiniteaperture.explorerplan
            UTTypeDescription: Explorer plan
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [explorerplan]
              public.mime-type: [application/x-explorerplan]
        LSSupportsOpeningDocumentsInPlace: false
